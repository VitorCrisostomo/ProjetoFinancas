name: financehub

x-runtime: &runtime
  image: financehub-api:local
  user: "10001:10001"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
  environment: &api-environment
    FINANCEHUB_ENV_FILE: /state/config/app.env
    FINANCEHUB_DOCKER_PROXY: ${FINANCEHUB_WEB_IP:-172.30.84.3}
  logging: &logging
    driver: local
    options:
      max-size: "10m"
      max-file: "7"
  stop_grace_period: 30s
  pids_limit: 128
  volumes: &state-volumes
    - type: bind
      source: ${FINANCEHUB_STATE_ROOT:?Informe o diretório externo de estado}/state/config
      target: /state/config
      bind: {create_host_path: false}
    - type: bind
      source: ${FINANCEHUB_STATE_ROOT:?Informe o diretório externo de estado}/state/keys
      target: /state/keys
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ${FINANCEHUB_STATE_ROOT:?Informe o diretório externo de estado}/state/data
      target: /state/data
      bind: {create_host_path: false}
    - type: bind
      source: ${FINANCEHUB_STATE_ROOT:?Informe o diretório externo de estado}/state/backups
      target: /state/backups
      bind: {create_host_path: false}
    - type: bind
      source: ${FINANCEHUB_STATE_ROOT:?Informe o diretório externo de estado}/state/logs
      target: /state/logs
      bind: {create_host_path: false}

services:
  api:
    <<: *runtime
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    command: ["python", "-B", "-u", "server.py"]
    restart: unless-stopped
    networks:
      application:
        ipv4_address: ${FINANCEHUB_API_IP:-172.30.84.2}
    healthcheck:
      test: ["CMD", "python", "-B", "/app/deploy/docker/check_api_health.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    image: financehub-web:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    user: "10002:10002"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777", "/config:rw,nosuid,size=16m,uid=10002,gid=10002", "/data:rw,nosuid,size=16m,uid=10002,gid=10002"]
    environment:
      APP_HOST: ${APP_HOST:?Informe o hostname real do Tailscale}
      FRONTEND_ROOT: /srv
      BIND_ADDRESS: "0.0.0.0"
      UPSTREAM_ADDRESS: "api:8000"
      TRUSTED_PROXY_CIDRS: ${FINANCEHUB_GATEWAY:-172.30.84.1}/32
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy, restart: true}
    networks:
      application:
        ipv4_address: ${FINANCEHUB_WEB_IP:-172.30.84.3}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header=\"Host: $${APP_HOST}\" http://127.0.0.1:8080/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *logging
    stop_grace_period: 30s
    pids_limit: 64

  backup:
    <<: *runtime
    command: ["python", "-B", "-u", "/app/deploy/docker/backup_scheduler.py", "--state-dir", "/state", "--timezone", "America/Sao_Paulo"]
    network_mode: none
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-B", "/app/deploy/docker/backup_scheduler.py", "--state-dir", "/state", "--healthcheck"]
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 5m

  bootstrap:
    <<: *runtime
    profiles: [tools]
    network_mode: none
    environment: {}
    entrypoint: ["python", "-B", "/app/deploy/prepare_state.py", "--state-dir", "/bootstrap/state", "--origin", "https://${APP_HOST:?Informe o hostname real do Tailscale}", "--target", "docker", "--docker-proxy", "${FINANCEHUB_WEB_IP:-172.30.84.3}"]
    command: []
    volumes:
      - type: bind
        source: ${FINANCEHUB_STATE_ROOT:?Informe o diretório externo de estado}
        target: /bootstrap
        bind: {create_host_path: false}
    healthcheck: {disable: true}

  maintenance:
    <<: *runtime
    profiles: [tools]
    network_mode: none
    command: ["python", "-B", "-m", "flask", "--app", "main", "--help"]
    healthcheck: {disable: true}

networks:
  application:
    driver: bridge
    ipam:
      config:
        - subnet: ${FINANCEHUB_SUBNET:-172.30.84.0/29}
          gateway: ${FINANCEHUB_GATEWAY:-172.30.84.1}
