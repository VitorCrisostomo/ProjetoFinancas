[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["node_modules", "instance", "venv", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["config", "exceptions", "main", "models", "repositories", "routes", "services"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
